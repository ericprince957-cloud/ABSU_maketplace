name: Build check

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci 2>&1 | tee install.log

      - name: Build
        run: npm run build 2>&1 | tee build-output.log

      - name: Publish logs
        if: always()
        run: |
          set -e
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          mkdir -p logs
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          cp install.log "logs/install-${STAMP}.log" 2>/dev/null || true
          cp build-output.log "logs/build-${STAMP}.log" 2>/dev/null || true
          git checkout -b build-logs || git checkout build-logs
          git add logs
          git commit -m "Build logs ${STAMP}" || echo "nothing to commit"
          git push origin build-logs -f
